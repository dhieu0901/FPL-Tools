name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      backup_or_empty_confirmed:
        description: I verified an off-site backup, or confirmed this is a new empty database
        required: true
        type: boolean
      confirmation:
        description: Type MIGRATE to apply all pending migrations to production
        required: true
        type: string
      season_code:
        description: Optional first-run season code, for example 2026/27
        required: false
        type: string
      season_name:
        description: Optional first-run display name, required when season_code is set
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate migration safety confirmations
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
          BACKUP_OR_EMPTY_CONFIRMED: ${{ inputs.backup_or_empty_confirmed }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$TARGET_REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations may run only from main"
            exit 1
          fi
          if [ "$BACKUP_OR_EMPTY_CONFIRMED" != "true" ]; then
            echo "::error::Confirm a verified backup or a new empty database"
            exit 1
          fi
          if [ "$CONFIRMATION" != "MIGRATE" ]; then
            echo "::error::Type MIGRATE exactly"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate the migration connection secret
        shell: bash
        env:
          VMF_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$VMF_MIGRATION_DATABASE_URL" ]; then
            echo "::error::Missing production secret SUPABASE_MIGRATION_DATABASE_URL"
            exit 1
          fi
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked
      - name: Show current revision
        env:
          VMF_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          VMF_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: .venv/bin/python -m alembic current
      - name: Upgrade to repository head
        env:
          VMF_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          VMF_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: .venv/bin/python -m alembic upgrade head
      - name: Verify resulting revision
        env:
          VMF_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          VMF_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: .venv/bin/python -m alembic current --check-heads
      - name: Validate optional season bootstrap inputs
        if: inputs.season_code != '' || inputs.season_name != ''
        shell: bash
        env:
          SEASON_CODE: ${{ inputs.season_code }}
          SEASON_NAME: ${{ inputs.season_name }}
        run: |
          if [ -z "$SEASON_CODE" ] || [ -z "$SEASON_NAME" ]; then
            echo "::error::season_code and season_name must be supplied together"
            exit 1
          fi
      - name: Bootstrap season metadata
        if: inputs.season_code != '' && inputs.season_name != ''
        env:
          VMF_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          VMF_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          SEASON_CODE: ${{ inputs.season_code }}
          SEASON_NAME: ${{ inputs.season_name }}
        run: >-
          .venv/bin/vmf-bootstrap-season
          --season-code "$SEASON_CODE"
          --season-name "$SEASON_NAME"
