name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra dev
      - name: Verify requirements.txt matches the lock file
        shell: bash
        run: |
          # Vercel installs from requirements.txt, so drift against uv.lock
          # would ship versions to production that CI never tested. Only the
          # pins are compared, because the header comment and layout differ
          # between uv releases.
          strip() { grep -v '^\s*#' "$1" | sed 's/\s*#.*//' | grep -v '^\s*$' | sort; }
          uv export --format requirements-txt --no-dev --no-emit-project \
            --no-hashes -o requirements.expected.txt
          if ! diff -u <(strip requirements.txt) <(strip requirements.expected.txt); then
            echo "::error::requirements.txt is stale; regenerate it with uv export"
            exit 1
          fi
          rm requirements.expected.txt
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
