[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vmf-fantasy-api"
version = "0.1.0"
description = "VMF Fantasy League competition API and rule engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.37,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
vmf-bootstrap-season = "vmf_api.cli.bootstrap_season:main"
vmf-import-managers = "vmf_api.cli.import_managers:main"
vmf-replace-roster = "vmf_api.cli.replace_roster:main"
vmf-generate-h2h-schedule = "vmf_api.cli.generate_h2h_schedule:main"
vmf-swap-divisions = "vmf_api.cli.swap_divisions:main"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vmf_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["vmf_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
