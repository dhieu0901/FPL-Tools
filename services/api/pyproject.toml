[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vmf-fantasy-api"
version = "0.1.0"
description = "VMF Fantasy League competition API and rule engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.37,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vmf_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["vmf_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
